/* =========================================================
   Il cucciolo di Lolo — un piccolo Tamagotchi per imparare l'empatia:
   guardare il cucciolo (faccia + corpo), capire cosa gli serve, aiutarlo.
   3 cuccioli: scimmietta, scoiattolo, foca. La giornata avanza facendo i passi
   della routine (mattina → scuola → pomeriggio → siesta → sera → nanna).
   Niente "hai perso": il cucciolo non si ammala mai, al massimo fa il broncio.
   Cuccioli, pose ed espressioni: copiati da proposta-espressioni.html (stessa fonte).
   ========================================================= */

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

// ---------- helpers ----------
const TAU = Math.PI * 2, INK = '#5a4a6a', RAINBOW = ['#ffadad', '#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff', '#a0c4ff', '#bdb2ff'];
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function rr(c, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot || 0, 0, TAU); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(.1, r), 0, TAU); }
function starPath(c, x, y, r, rot) { c.beginPath(); for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r * .48 : r; i ? c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad) : c.moveTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); } c.closePath(); }
function heartPath(c, x, y, r) { c.beginPath(); c.moveTo(x, y + r * .9); c.bezierCurveTo(x - r * 1.4, y - r * .1, x - r * .7, y - r * 1.2, x, y - r * .4); c.bezierCurveTo(x + r * .7, y - r * 1.2, x + r * 1.4, y - r * .1, x, y + r * .9); c.closePath(); }
function dropPath(c, x, y, r) { c.beginPath(); c.moveTo(x, y - r * 1.6); c.quadraticCurveTo(x + r * 1.1, y - r * .1, x, y + r); c.quadraticCurveTo(x - r * 1.1, y - r * .1, x, y - r * 1.6); c.closePath(); }

// ---------- 🐢 facile / 🐇 normale (condivisa tra i giochi) ----------
const SPEEDS = {
  lento:   { icon: '🐢', label: 'Facile: un passo alla volta, l\'oggetto giusto è già pronto', k: .8 },
  normale: { icon: '🐇', label: 'Normale: scegli tu l\'oggetto giusto, e a volte chiede qualcosa in più', k: 1 },
};
const SPEED_ORDER = ['lento', 'normale'];
let speedKey = 'lento';
try { const s = localStorage.getItem('lolo-speed'); if (SPEEDS[s]) speedKey = s; } catch (e) {}
const SPD = () => SPEEDS[speedKey];

// =========================================================
//  AUDIO (tutto generato in codice)
// =========================================================
let ac = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  ac = new AC();
  const comp = ac.createDynamicsCompressor(); master = ac.createGain(); master.gain.value = .7;
  master.connect(comp); comp.connect(ac.destination);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
const canPlay = () => ac && !muted;
function env(g, t0, a, d, vol) { g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + a + d); }
function tone(f0, f1, dur, type, vol, delay) {
  if (!canPlay()) return;
  const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t0); if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  env(g, t0, .01, dur, vol || .2); o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .05);
}
function noise(dur, f0, f1, vol, type, delay) {
  if (!canPlay()) return;
  const t0 = ac.currentTime + (delay || 0), s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type || 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = ac.createGain(); env(g, t0, .02, dur, vol); s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + .05);
}

    for (let r = 0; r < (long ? 2 : 1); r++) notes.reduce((d, [f, l]) => { tone(f, f, l * .9, 'sine', .065, r * 5.1 + d); return d + l * .55; }, 0);
  },
};
// versi dei cuccioli (gli animali fanno solo i versi)
const VOICES = {
  scimmietta() { [0, .13, .26].forEach(d => tone(650, 980, .1, 'triangle', .12, d)); tone(900, 600, .26, 'triangle', .11, .42); },
  scoiattolo() { for (let i = 0; i < 6; i++) tone(1500 + Math.random() * 400, 1900, .04, 'square', .05, i * .055); },
  foca() { tone(420, 300, .16, 'sawtooth', .1); tone(430, 300, .18, 'sawtooth', .1, .24); },
  ippopotamo() { tone(140, 110, .28, 'sawtooth', .1); tone(160, 120, .22, 'triangle', .1, .32); for (let i = 0; i < 3; i++) tone(500 + i * 120, 700 + i * 120, .06, 'sine', .06, .6 + i * .07); }, // brontolio buffo + bollicine
  elefante() { tone(380, 760, .35, 'sawtooth', .09); tone(760, 640, .25, 'sawtooth', .07, .33); }, // barrito piccolino

// ---------- voce: solo 'Bravo Lolo!' / 'Bravissimo Lolo!' / 'Wow!' ----------
const VOICE_CLIPS = {}; // es. { 'Bravo Lolo!': 'bravo-lolo.mp3' } → registrazione di papà/mamma
const clipCache = {};
let voiceIt = null, voiceEs = null, voiceEn = null;
function pickVoices() {
  if (!('speechSynthesis' in window)) return;
  const all = speechSynthesis.getVoices();
  const best = re => { const vs = all.filter(v => re.test(v.lang)); const sc = v => (/natural|neural|enhanced|premium/i.test(v.name) ? 8 : 0) + (/google/i.test(v.name) ? 4 : 0) + (v.localService ? 1 : 0); return vs.sort((a, b) => sc(b) - sc(a))[0] || null; };
  voiceIt = best(/^it([-_]|$)/i); voiceEs = best(/^es([-_]|$)/i); voiceEn = best(/^en([-_]|$)/i);
}
if ('speechSynthesis' in window) { pickVoices(); if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoices); }
function speak(text) {
  if (muted) return;
  const src = VOICE_CLIPS[text];
  if (src) { try { const a = clipCache[text] || (clipCache[text] = new Audio(src)); a.currentTime = 0; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} return; }
  if (!('speechSynthesis' in window)) return;
  if (!voiceIt && !voiceEs && !voiceEn) pickVoices();
  const isWow = text === 'Wow!', v = voiceIt || voiceEs || (isWow ? voiceEn : null);
  if (!v) return;
  const say = isWow ? (v === voiceEn ? 'Wooow!' : 'Uaau!') : text;
  try { const u = new SpeechSynthesisUtterance(say); u.voice = v; u.lang = v.lang; u.rate = isWow ? .7 : .9; u.pitch = 1; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}

function limb(c, s, x0, y0, x1, y1, bend, w, col) { // braccio morbido con il gomito
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1;
  c.strokeStyle = col; c.lineWidth = s * w; c.lineCap = 'round';
  c.beginPath(); c.moveTo(s * x0, s * y0); c.quadraticCurveTo(s * (mx - dy / L * bend), s * (my + dx / L * bend), s * x1, s * y1); c.stroke();
}

    }
    else { const bx = x + s * 1.1, by = y + s * .9 - Math.abs(Math.sin(u * Math.PI * 4)) * s * .9; emo('⚽', bx, by, s * .45, u * 12); }
  }
  if (a.act === 'blanket') { // copertina sulle spalle
    ctx.fillStyle = '#ffadc8'; rr(ctx, x - s * .62, y - s * .05, s * 1.24, s * .3 * Math.min(1, u * 3), s * .12); ctx.fill();
    ctx.fillStyle = '#fff'; for (let i = 0; i < 4; i++) { circ(ctx, x - s * .45 + i * s * .3, y + s * .08, s * .035); ctx.fill(); }
  }
  if (a.act === 'breathe') { // respiro guidato: il cerchio si gonfia (3 s, dentro) e si sgonfia (3 s, fuori), 2 volte
    const b = breathAmt(a), R0 = s * 1.25, R1 = s * 2.1, rr0 = lerp(R0, R1, b);
    ctx.strokeStyle = 'rgba(160,200,255,.85)'; ctx.lineWidth = 6; circ(ctx, x, y - s * .2, rr0); ctx.stroke();
    ctx.fillStyle = 'rgba(191,233,255,.12)'; ctx.fill();
    itemIcon('soffione', x + s * 1.35, y - s * .1, s * .7, t);
    const inhale = (u * 2) % 1 < .5, txt = inhale ? 'Respira…' : 'Soffia… 💨', ty = y - s * 1.75 - rr0 * .15; // etichetta bianca, testo scuro: si legge bene
    ctx.font = `bold ${Math.round(s * .32)}px "Comic Sans MS","Chalkboard SE",system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(txt).width; ctx.fillStyle = 'rgba(255,255,255,.95)'; rr(ctx, x - tw / 2 - s * .2, ty - s * .26, tw + s * .4, s * .52, s * .26); ctx.fill(); strokeOut(2);
    ctx.fillStyle = INK; ctx.fillText(txt, x, ty + 1);
  }
  if (a.act === 'sponge') { // spugna sulla pozzetta, con le bollicine
    emo('🧽', x + Math.sin(t * 9) * s * .5, y + s * 1.0, s * .45, Math.sin(t * 9) * .3);
    ctx.fillStyle = 'rgba(255,255,255,.85)'; for (let i = 0; i < 6; i++) { circ(ctx, x + Math.sin(t * 3 + i) * s * .6, y + s * (1.0 - ((t * .8 + i / 6) % 1) * .4), s * .04); ctx.fill(); }
  }
  if (a.act === 'hug') { for (let i = 0; i < 2; i++) parts.push({ x: x + rand(-s, s), y: y - s * 1.6, vx: rand(-20, 20), vy: rand(60, 140), life: 1, c: pick(['#ff8fa3', '#ffadc8', '#ff6b81']), kind: 'heart', r: rand(7, 12) }); } // pioggia di cuori
  if (a.act === 'plush') emo('🧸', x, y + s * .35, s * .62, Math.sin(t * 4) * .1); // stretto al petto
  if (a.act === 'handwash') { // mani insaponate: schiuma sulle mani e acqua dal rubinetto
    emo('🧼', x + Math.sin(t * 10) * s * .2, y + s * .35, s * .32);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; for (let i = 0; i < 8; i++) { circ(ctx, x + Math.cos(i * .8 + t * 3) * s * .35, y + s * .3 + Math.sin(i * .8 + t * 3) * s * .15, s * (.05 + (i % 3) * .02)); ctx.fill(); }
    if (u > .55) { ctx.fillStyle = 'rgba(143,211,255,.85)'; for (let i = 0; i < 6; i++) { const p = (t * 2 + i / 6) % 1; dropPath(ctx, x - s * .2 + (i % 3) * s * .2, y - s * .4 + p * s * .8, s * .035); ctx.fill(); } }
  }
  if (a.act === 'sleep' && care.stage === 'malato2') { // malato: si infila sotto la coperta
    ctx.fillStyle = '#c3a6ff'; rr(ctx, x - s * .85, y + s * .05, s * 1.7, s * 1.0, s * .3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.4)'; for (let i = 0; i < 5; i++) { circ(ctx, x - s * .55 + i * s * .28, y + s * .45, s * .06); ctx.fill(); }
  }
  if (a.act === 'wash' && ME().spray) { // l'elefantino si spruzza da solo con la proboscide: archi d'acqua sopra la testa
    ctx.fillStyle = 'rgba(143,211,255,.9)'; for (let i = 0; i < 12; i++) { const p = (t * 1.4 + i / 12) % 1; dropPath(ctx, x + s * (.84 - p * 1.5), y - s * (.45 + Math.sin(p * Math.PI) * 1.3), s * .045); ctx.fill(); }
  }
  if (a.act === 'wash') { // schiuma e doccia
    ctx.fillStyle = 'rgba(255,255,255,.85)'; for (let i = 0; i < 14; i++) { const ang = i * 2.4, rad = s * (.3 + (i % 3) * .2); circ(ctx, x + Math.cos(ang) * rad * .8, y - s * .2 + Math.sin(ang) * rad, s * (.09 + (i % 2) * .05) * Math.min(1, u * 4) * (u > .85 ? (1 - u) / .15 : 1)); ctx.fill(); }
    ctx.fillStyle = 'rgba(143,211,255,.8)'; for (let i = 0; i < 10; i++) { const p = (t * 1.6 + i / 10) % 1; dropPath(ctx, x - s * .7 + (i % 5) * s * .35, y - s * 1.6 + p * s * 1.8, s * .035); ctx.fill(); }
  }
}

// =========================================================
//  INPUT: tocca (saltella e ride), accarezza (cuori, fusa: consola coccole e tristezza)
// =========================================================
let down = null;
const onPet = (x, y) => Math.hypot(x - pet.x, y - (L.petY - L.s * .3)) < L.s * 1.35;
function thoughtCenter() { const F = PETS[pet.kind].face; return { x: pet.x + L.s * 1.05, y: L.petY + F.top * L.s - L.s * .25 }; }
function tapThought(x, y) { // 🐢: la nuvoletta è un aiuto, non una risposta automatica
  if (speedKey !== 'lento' || !care.stage || pet.action || !pet.atCenter || R.nap || R.night) return false;
  const p = thoughtCenter(); if (Math.hypot(x - p.x, y - p.y) > L.s * .55) return false;
  care.glow = true; care.bubbleTap = 2; pet.jump = .25; sfx.pop(); return true;
}
cv.addEventListener('pointerdown', e => {
  if (!started) return;
  initAudio();
  const x = e.clientX, y = e.clientY;
  if (scene === 'choose' || !pet.kind) {
    unlockedPets().forEach((k, i) => { const p = choosePos(i); if (Math.hypot(x - p.x, y - (p.y - p.s * .3)) < p.s * 1.3) choosePet(k); });
    return;
  }
  if (tapThought(x, y)) return; // ha toccato la nuvoletta: il bottone giusto pulsa
  const slot = barSlots().find(b => Math.hypot(x - b.x, y - b.y) < b.r * 1.16); // bottoni più grandi + area tattile generosa ma senza sovrapporsi
  if (slot && !pet.action && !flyItem) { dragItem = { k: slot.k, x, y, x0: slot.x, y0: slot.y, moved: 0 }; try { cv.setPointerCapture(e.pointerId); } catch (er) {} return; }
  if (onPet(x, y)) { down = { x, y, moved: 0 }; try { cv.setPointerCapture(e.pointerId); } catch (er) {} return; }
  burst(x, y, 6, RAINBOW, 'star'); tone(1200 + Math.random() * 600, 1500, .12, 'sine', .05);
});
cv.addEventListener('pointermove', e => {
  if (scene !== 'room' || !pet.kind) return;
  const x = e.clientX, y = e.clientY;
  pet.look = [clamp((x - pet.x) / (L.s * 2), -1, 1), clamp((y - L.petY) / (L.s * 2), -1, 1)]; // ti segue con gli occhi
  if (dragItem) { dragItem.moved += Math.hypot(x - dragItem.x, y - dragItem.y); dragItem.x = x; dragItem.y = y; return; }
  if (!down) return;
  const d = Math.hypot(x - down.x, y - down.y); down.moved += d; down.x = x; down.y = y;
  if (d > 2 && onPet(x, y)) { // carezza
    pet.pet = Math.min(1.6, pet.pet + d / (L.s * 3));
    if (Math.random() < .25) parts.push({ x, y: y - 10, vx: rand(-30, 30), vy: rand(-90, -40), life: 1, c: pick(['#ff8fa3', '#ffadc8', '#ff6b81']), kind: 'heart', r: rand(7, 12) });
    if (Math.random() < .04) sfx.purr();
    if (acceptsPetting() && pet.pet > 1.2 && !pet.action) { pet.pet = 0; resolveStep(); } // la carezza consola (coccole, triste, arrabbiato, vergogna)
  }
});
function release() {
  if (dragItem) { // lasciato sul cucciolo = lo usa; un tocco = l'oggetto vola da solo; altrove = torna nella barra
    const d = dragItem; dragItem = null;
    if (d.moved < 14) flyItem = { k: d.k, x0: d.x0, y0: d.y0, x: d.x0, y: d.y0, t: 0 };
    else if (onPet(d.x, d.y)) useItem(d.k);
    return;
  }
  if (!down) return;
  if (down.moved < 12) { pet.jump = 1; if (pet.mood === 'felice') sfx.giggle(); else VOICES[pet.kind](); } // tocco: saltella
  down = null;
}
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);

// =========================================================
//  AVVIO E BOTTONI
// =========================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
document.getElementById('play').addEventListener('click', () => {
  initAudio(); started = true;
  document.getElementById('start').classList.add('hide');
  goFullscreen(); sfx.fanfare();
  if (pet.kind) { scene = 'room'; pet.arrive = 1; VOICES[pet.kind](); startDay(); } else scene = 'choose';
});
document.getElementById('btnPet').addEventListener('click', () => { if (!started) return; initAudio(); scene = 'choose'; sfx.pop(); });
const btnMute = document.getElementById('btnMute');
btnMute.addEventListener('click', () => {
  muted = !muted; btnMute.textContent = muted ? '🔇' : '🔊';
  btnMute.setAttribute('aria-label', muted ? "Accendi l'audio" : "Spegni l'audio");
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
});
const btnSpeed = document.getElementById('btnSpeed');
function showSpeed() { btnSpeed.textContent = SPD().icon; btnSpeed.setAttribute('aria-label', SPD().label + ' (tocca per cambiare)'); btnSpeed.title = SPD().label; }
btnSpeed.addEventListener('click', () => {
  speedKey = SPEED_ORDER[(SPEED_ORDER.indexOf(speedKey) + 1) % SPEED_ORDER.length];
  try { localStorage.setItem('lolo-speed', speedKey); } catch (e) {}
  showSpeed();
});
showSpeed();
const btnFull = document.getElementById('btnFull');
const ICON_FULL = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="#5a6aa8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ICON_EXIT = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="#5a6aa8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function goFullscreen() { const el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen; if (!fn) return; try { const r = fn.call(el); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
function exitFullscreen() { const fn = document.exitFullscreen || document.webkitExitFullscreen; if (!fn) return; try { const r = fn.call(document); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
function showFull() { const on = isFull(); btnFull.innerHTML = on ? ICON_EXIT : ICON_FULL; btnFull.setAttribute('aria-label', on ? 'Esci dallo schermo intero' : 'Schermo intero'); btnFull.title = on ? 'Esci dallo schermo intero' : 'Schermo intero'; }
btnFull.addEventListener('click', () => { if (isFull()) exitFullscreen(); else goFullscreen(); });
document.addEventListener('fullscreenchange', showFull);
document.addEventListener('webkitfullscreenchange', showFull);
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) btnFull.style.display = 'none';
showFull();

let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 150); });

layout();
requestAnimationFrame(frame);
</script>
